[project]
name = "pbui"
version = "0.1.0"
description = "A presentation-based terminal listener"
readme = "README.md"
authors = [
    { name = "Eduardo Cavazos", email = "wayo.cavazos@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "wcwidth>=0.8.4",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
